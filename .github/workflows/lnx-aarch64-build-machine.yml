# 2024 Legacy team
name: LinuxArmBuildMachine

on:
  # CI decides when automatic publication is required and waits for completion.
  workflow_call:
    outputs:
      image:
        description: Versioned Linux ARM64 build image published by this workflow
        value: ${{ jobs.docker.outputs.image }}
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
  workflow_dispatch:

jobs:
  docker:
    # Native arm64 runner: docker build produces an arm64 image.
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/master'
    # Serialize automatic and manual publishers without replacing pending jobs.
    concurrency:
      group: lnx-aarch64-build-publication
      cancel-in-progress: false
      queue: max
    # Callers use this exact version even if another run updates latest afterward.
    outputs:
      image: etlegacy/lnx-aarch64-build:${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to DockerHub Registry
        run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Get the version
        id: vars
        run: |
          echo "tag=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build and push the versioned Docker image
        run: |
          docker build --platform linux/arm64 misc/docker --file misc/docker/lnx-aarch64.Dockerfile --tag etlegacy/lnx-aarch64-build:latest --tag etlegacy/lnx-aarch64-build:${{steps.vars.outputs.tag}}
          docker push etlegacy/lnx-aarch64-build:${{steps.vars.outputs.tag}}

      - name: Publish latest if the Dockerfile is still current
        run: |
          # Compare file contents so unrelated master commits do not block publication.
          # The publishing queue keeps this check and tag update exclusive.
          built_dockerfile=$(git rev-parse HEAD:misc/docker/lnx-aarch64.Dockerfile)
          git fetch --no-tags origin refs/heads/master
          current_dockerfile=$(git rev-parse FETCH_HEAD:misc/docker/lnx-aarch64.Dockerfile)
          if [ "$built_dockerfile" != "$current_dockerfile" ]; then
            echo "The Dockerfile changed on master; leaving latest unchanged."
            exit 0
          fi

          docker push etlegacy/lnx-aarch64-build:latest
