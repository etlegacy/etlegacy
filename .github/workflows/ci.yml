name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

# Preserve every master run so required image publication cannot be superseded.
# Other refs share a group so newer runs cancel their unfinished predecessors.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  pre-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      describe: ${{ steps.git.outputs.describe }}
      tag: ${{ steps.git.outputs.tag }}
      lnx_image: ${{ steps.changes.outputs.lnx_image }}
      lnx_aarch64_image: ${{ steps.changes.outputs.lnx_aarch64_image }}
      android_image: ${{ steps.changes.outputs.android_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Manual runs always use the published build images.
      - name: Check build image changes
        uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: changes
        with:
          base: master
          filters: |
            lnx_image:
              - 'misc/docker/build.Dockerfile'
            lnx_aarch64_image:
              - 'misc/docker/lnx-aarch64.Dockerfile'
            android_image:
              - 'misc/docker/android.Dockerfile'

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true

      - name: Check changes
        run: |
          pixi run check-changes --github "origin/master"

      - name: Fetch git version information
        id: git
        run: |
          git fetch --tags --force
          git_describe=$(git describe --abbrev=7 2>/dev/null | awk '{$1=$1};1')
          git_tag=$(git describe --abbrev=0 2>/dev/null | awk '{$1=$1};1')
          echo "Version info: $git_describe ?? $git_tag"
          echo "describe=$git_describe" >> "$GITHUB_OUTPUT"
          echo "tag=$git_tag" >> "$GITHUB_OUTPUT"

  # Linux builds wait for publication and use the returned versioned image.
  publish-lnx-build-image:
    needs: [pre-build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.pre-build.outputs.lnx_image == 'true'
    uses: ./.github/workflows/lnx-build-machine.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

  # Share changed PR build environments without publishing them to DockerHub.
  lnx-build-image:
    runs-on: ubuntu-latest
    needs: [pre-build]
    if: github.event_name == 'pull_request' && needs.pre-build.outputs.lnx_image == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Build Linux build image
        run: |
          docker build misc/docker --file misc/docker/build.Dockerfile --tag etlegacy/lnx-build:ci
          docker save --output "$RUNNER_TEMP/lnx-build.tar" etlegacy/lnx-build:ci

      - name: Upload Linux build image
        uses: actions/upload-artifact@v7
        with:
          name: ci-lnx-build-image
          path: ${{ runner.temp }}/lnx-build.tar
          if-no-files-found: error
          compression-level: 1
          overwrite: true
          retention-days: 1

  # ARM64 builds wait for publication and use the returned versioned image.
  publish-lnx-aarch64-build-image:
    needs: [pre-build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.pre-build.outputs.lnx_aarch64_image == 'true'
    uses: ./.github/workflows/lnx-aarch64-build-machine.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

  # Android builds wait for publication and use the returned versioned image.
  publish-android-build-image:
    needs: [pre-build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.pre-build.outputs.android_image == 'true'
    uses: ./.github/workflows/android-build-machine.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

  # Run the build on all the current platforms
  #
  # Keep Linux compilation and packaging in the legacy image for compatibility.
  # Run checkout and artifact actions on Ubuntu, where their Node runtime works.
  lnx64:
    runs-on: ubuntu-latest
    needs: [pre-build, publish-lnx-build-image, lnx-build-image]
    # Image preparation may be skipped, but any requested build or publish must succeed.
    if: &linux-ready >-
      !cancelled() && needs.pre-build.result == 'success' &&
      (needs.publish-lnx-build-image.result == 'success' || needs.publish-lnx-build-image.result == 'skipped') &&
      (needs.lnx-build-image.result == 'success' || needs.lnx-build-image.result == 'skipped')
    env:
      LNX_BUILD_IMAGE: &linux-image ${{ needs.lnx-build-image.result == 'success' && 'etlegacy/lnx-build:ci' || needs.publish-lnx-build-image.outputs.image || 'etlegacy/lnx-build:latest' }}
      CI_ETL_DESCRIBE: ${{ needs.pre-build.outputs.describe }}
      CI_ETL_TAG: ${{ needs.pre-build.outputs.tag }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Each runner needs its own copy of the image before invoking docker run.
      - &download-lnx-build-image
        name: Download Linux build image
        if: needs.lnx-build-image.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ci-lnx-build-image
          path: ${{ runner.temp }}

      - &load-lnx-build-image
        name: Load Linux build image
        if: needs.lnx-build-image.result == 'success'
        run: docker load --input "$RUNNER_TEMP/lnx-build.tar"

      - name: Build
        run: |
          # Match host ownership and paths so artifacts and warning logs remain usable.
          # Give the container user a writable home without mounting the host home.
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CI --env CI_ETL_DESCRIBE --env CI_ETL_TAG \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            "$LNX_BUILD_IMAGE" ./easybuild.sh build -64

      - name: Generate packages
        run: |
          # CPack needs the same container tools and absolute paths as the build.
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CI --env CI_ETL_DESCRIBE --env CI_ETL_TAG \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE/build" \
            "$LNX_BUILD_IMAGE" cpack

      # Reuse collection and upload steps for every desktop platform.
      - &collect-binaries
        name: Collect binaries and libraries
        shell: bash
        working-directory: build
        run: |
          # Exclude compiler probes and duplicate CPack staging trees.
          find . -type d \( -name CMakeFiles -o -name _CPack_Packages \) -prune -o \
            \( -type f -o -type l \) \( \
              -name 'etl' -o -name 'etl.*' -o -name 'etlded' -o -name 'etlded.*' -o \
              -name '*.exe' -o -name '*.dll' -o -name '*.so' -o -name '*.so.*' -o \
              -name '*.dylib' -o -name '*.a' -o -name '*.lib' -o -name '*_mac' -o \
              -path '*.app/*' \) -print0 > "$RUNNER_TEMP/binaries.list"
          test -s "$RUNNER_TEMP/binaries.list"

          # Tar preserves executable permissions and library symlinks across jobs.
          tar -czf ../binaries.tar.gz --null -T "$RUNNER_TEMP/binaries.list"

      - &upload-binaries
        name: Upload platform binaries
        uses: actions/upload-artifact@v7
        with:
          name: ci-binaries-${{ github.job }}
          path: binaries.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  lnx32:
    runs-on: ubuntu-latest
    needs: [pre-build, publish-lnx-build-image, lnx-build-image]
    if: *linux-ready
    env:
      LNX_BUILD_IMAGE: *linux-image
      CI_ETL_DESCRIBE: ${{ needs.pre-build.outputs.describe }}
      CI_ETL_TAG: ${{ needs.pre-build.outputs.tag }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - *download-lnx-build-image
      - *load-lnx-build-image

      - name: Build
        run: |
          # Match host ownership and paths so artifacts and warning logs remain usable.
          # Give the container user a writable home without mounting the host home.
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CI --env CI_ETL_DESCRIBE --env CI_ETL_TAG \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            "$LNX_BUILD_IMAGE" ./easybuild.sh build -32

      - name: Generate packages
        run: |
          # CPack needs the same container tools and absolute paths as the build.
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CI --env CI_ETL_DESCRIBE --env CI_ETL_TAG \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE/build" \
            "$LNX_BUILD_IMAGE" cpack

      - *collect-binaries
      - *upload-binaries

  lnx-aarch64:
    runs-on: ubuntu-latest
    needs: [pre-build, publish-lnx-aarch64-build-image]
    # Publication may be skipped, but any requested publish must succeed.
    if: >-
      !cancelled() && needs.pre-build.result == 'success' &&
      (needs.publish-lnx-aarch64-build-image.result == 'success' || needs.publish-lnx-aarch64-build-image.result == 'skipped')
    env:
      LNX_AARCH64_BUILD_IMAGE: ${{ github.event_name == 'pull_request' && needs.pre-build.outputs.lnx_aarch64_image == 'true' && 'etlegacy/lnx-aarch64-build:ci' || needs.publish-lnx-aarch64-build-image.outputs.image || 'etlegacy/lnx-aarch64-build:latest' }}
      CI_ETL_DESCRIBE: ${{ needs.pre-build.outputs.describe }}
      CI_ETL_TAG: ${{ needs.pre-build.outputs.tag }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Build changed PR images on their only consumer's runner without publishing.
      - name: Build Linux ARM64 build image
        if: github.event_name == 'pull_request' && needs.pre-build.outputs.lnx_aarch64_image == 'true'
        run: docker build misc/docker --file misc/docker/lnx-aarch64.Dockerfile --tag "$LNX_AARCH64_BUILD_IMAGE"

      - name: Build and generate packages
        run: |
          # Match host ownership and paths so artifacts and warning logs remain usable.
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env CI --env CI_ETL_DESCRIBE --env CI_ETL_TAG \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            "$LNX_AARCH64_BUILD_IMAGE" sh -c '
              ./easybuild.sh build -RPIT -ninja &&
              cd build &&
              cpack
            '

      - *collect-binaries
      - *upload-binaries

  osx:
    runs-on: macos-15
    needs: [pre-build]
    env:
      CI_ETL_DESCRIBE: ${{ needs.pre-build.outputs.describe }}
      CI_ETL_TAG: ${{ needs.pre-build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: |
          brew bundle
          brew install freetype librsvg graphicsmagick imagemagick

      - name: Build
        env:
          SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
        shell: bash
        run: |
          ./easybuild.sh build -64 --osx=10.10 --osx-arc="x86_64;arm64" -j

      - name: Generate packages
        shell: bash
        run: ./easybuild.sh package -64 --osx=10.10 --osx-arc="x86_64;arm64" -j

      - *collect-binaries
      - *upload-binaries

  win:
    runs-on: windows-2022
    needs: [pre-build]
    env:
      CI_ETL_DESCRIBE: ${{ needs.pre-build.outputs.describe }}
      CI_ETL_TAG: ${{ needs.pre-build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build
        shell: cmd
        run: |
          call .\easybuild.bat build

      - name: Generate packages
        shell: cmd
        working-directory: build
        run: cpack

      - *collect-binaries
      - *upload-binaries

  win64:
    runs-on: windows-2022
    needs: [pre-build]
    env:
      CI_ETL_DESCRIBE: ${{ needs.pre-build.outputs.describe }}
      CI_ETL_TAG: ${{ needs.pre-build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build
        shell: cmd
        run: |
          call .\easybuild.bat build -64

      - name: Generate packages
        shell: cmd
        working-directory: build
        run: cpack

      - *collect-binaries
      - *upload-binaries

  android:
    runs-on: ubuntu-latest
    needs: [pre-build, publish-android-build-image]
    # Publication may be skipped, but any requested publish must succeed.
    if: >-
      !cancelled() && needs.pre-build.result == 'success' &&
      (needs.publish-android-build-image.result == 'success' || needs.publish-android-build-image.result == 'skipped')
    env:
      ANDROID_BUILD_IMAGE: ${{ github.event_name == 'pull_request' && needs.pre-build.outputs.android_image == 'true' && 'etlegacy/android-build:ci' || needs.publish-android-build-image.outputs.image || 'etlegacy/android-build:latest' }}
      CI_ETL_DESCRIBE: ${{ needs.pre-build.outputs.describe }}
      CI_ETL_TAG: ${{ needs.pre-build.outputs.tag }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Build changed PR images on their only consumer's runner without publishing.
      - name: Build Android build image
        if: github.event_name == 'pull_request' && needs.pre-build.outputs.android_image == 'true'
        run: docker build misc/docker --file misc/docker/android.Dockerfile --tag "$ANDROID_BUILD_IMAGE"

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build and Generate Package
        run: |
          # Keep SDK installations and the local Maven repository in one container.
          # Mount the configured JDK so compilation continues to use Java 17.
          docker run --rm \
            --env CI --env CI_ETL_DESCRIBE --env CI_ETL_TAG --env GITHUB_WORKSPACE \
            --env JAVA_HOME=/opt/ci-java \
            --volume "$JAVA_HOME:/opt/ci-java:ro" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            "$ANDROID_BUILD_IMAGE" bash -e -o pipefail -c '
              export PATH="$JAVA_HOME/bin:$PATH"

              # The container user differs from the host checkout owner.
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              git config --global --add safe.directory "$GITHUB_WORKSPACE/app/libs/joystick"

              # Publish the dependency where the following app build can find it.
              cd app/libs/joystick
              ./gradlew clean               --stacktrace --info
              ./gradlew assembleRelease     --stacktrace --info
              ./gradlew publishToMavenLocal --stacktrace --info

              cd "$GITHUB_WORKSPACE"
              ./gradlew clean assembleDebug
              ls -R

              # Rename outputs before returning them to the host runner.
              for FILE in ./app/build/outputs/apk/debug/*.apk; do
                mv "$FILE" "${FILE%-*}.apk"
              done
              ls app/build/outputs/apk/debug
            '

      - name: Collect Android binaries and libraries
        shell: bash
        run: |
          # Keep the ABI directories from the APK alongside the installable APK.
          mkdir -p android-binaries
          cp app/build/outputs/apk/debug/*.apk android-binaries/
          for apk in app/build/outputs/apk/debug/*.apk; do
            unzip -o "$apk" 'lib/*' -d android-binaries
          done
          tar -czf binaries.tar.gz -C android-binaries .

      - *upload-binaries

  check-build-artifacts:
    runs-on: ubuntu-latest
    needs: [android, lnx-aarch64, lnx32, lnx64, osx, win, win64]
    # Check platforms explicitly: needs.* can include skipped image ancestors.
    if: &platform-builds-succeeded >-
      !cancelled() &&
      needs.android.result == 'success' &&
      needs.lnx-aarch64.result == 'success' &&
      needs.lnx32.result == 'success' &&
      needs.lnx64.result == 'success' &&
      needs.osx.result == 'success' &&
      needs.win.result == 'success' &&
      needs.win64.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all platform binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ci-binaries-*
          path: .ci-binaries

      - name: Assemble distribution
        shell: bash
        run: |
          # Extract each platform into its own directory without losing file modes.
          for archive in .ci-binaries/ci-binaries-*/binaries.tar.gz; do
            platform="${archive#*/ci-binaries-}"
            platform="${platform%/binaries.tar.gz}"
            mkdir -p "dist/$platform"
            tar -xzf "$archive" -C "dist/$platform"
          done
          tar -czf dist.tar.gz dist

      - name: Publish distribution
        if: github.run_attempt > 1
        uses: actions/upload-artifact@v7
        with:
          name: ci-dist
          path: dist.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true

      - name: Check Build Artifacts
        run: |
          pixi run dist-manifest-check --github

  check-compiler-warnings:
    runs-on: ubuntu-latest
    needs:
      - android
      - lnx-aarch64
      - lnx32
      - lnx64
      - osx
      - win
      - win64
    if: *platform-builds-succeeded
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true

      - name: Collect and Check GitHub Build Logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # fallback
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          pixi run collect-and-check-gh-build-logs --github

  ci-discord-notify-on-failure:
    needs:
      - pre-build
      - publish-lnx-build-image
      - publish-lnx-aarch64-build-image
      - publish-android-build-image

      - android
      - lnx-aarch64
      - lnx32
      - lnx64
      - osx
      - win
      - win64

      - check-build-artifacts
      - check-compiler-warnings
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.LEGACY_CI_WEBHOOK }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DEVS_ROLE_ID: "260752921698762752"
        run: |
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          MESSAGE="❌ **[failed on commit](<${RUN_URL}>)** \`${COMMIT_SHA}\` <@&${DEVS_ROLE_ID}>"

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"$MESSAGE\", \"allowed_mentions\": {\"roles\": [\"$DEVS_ROLE_ID\"]}}" \
               "$DISCORD_WEBHOOK"
