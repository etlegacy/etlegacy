name: Snapcraft

# Controls when the workflow will run
on:
  workflow_dispatch:
  # CI calls this once a release build was uploaded successfully.
  workflow_call:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    # Must match the base of the snap (core24 is Ubuntu 24.04), as the snap is
    # built directly on the runner. Do not use ubuntu-latest here.
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          repository: etlegacy/etlegacy-snap
          fetch-depth: 1

      # Builds natively on the runner (amd64) without LXD or Docker. Unlike
      # the Docker based snapcraft-multiarch-action this fails instead of
      # hanging forever when the Snap Store can not be reached. Other
      # architectures would need a runner of that architecture.
      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic --channel 9.x/stable

      - name: Build SNAP
        id: snapcraft
        run: |
          # Root is needed as snapcraft installs the build packages via apt
          sudo snapcraft pack --destructive-mode --verbose
          # Hand the resulting file name to the publish step
          snap="$(ls ./*.snap)"
          echo "snap=$snap" >> "$GITHUB_OUTPUT"
      - name: Publish
        uses: snapcore/action-publish@v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: edge
#          release: stable
#          release: candidate
#          release: beta

