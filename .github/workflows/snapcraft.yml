name: Snapcraft

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      matrix:
        platform:
          - amd64
          # - arm64
          # - i386

    steps:
      - uses: actions/checkout@v4
        with:
          repository: etlegacy/etlegacy-snap
          fetch-depth: 1

      - name: Build and publish SNAP
        shell: python
        timeout-minutes: 30
        env:
          ARCH: ${{ matrix.platform }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          import os
          import subprocess
          import time
          import uuid
          from pathlib import Path

          IMAGE = "ghcr.io/canonical/snapcraft-container:core24"
          ARCH = os.environ["ARCH"]
          DEADLINE = time.monotonic() + 29 * 60 + 30
          RETRIES = 3
          COOLDOWN = 60

          def retry(label, args, before=None):
              for attempt in range(RETRIES + 1):
                  if before:
                      before()

                  remaining = DEADLINE - time.monotonic()
                  if remaining <= 15:
                      raise TimeoutError("30-minute budget exhausted")

                  name = f"snapcraft-{uuid.uuid4().hex[:12]}"
                  command = [
                      "docker", "run", "--rm",
                      "--name", name,
                      "--privileged",
                      "--platform", f"linux/{ARCH}",
                      "-v", f"{os.getcwd()}:/data",
                      "-w", "/data",
                      *args,
                  ]

                  print(
                      f"{label}: attempt {attempt + 1}/{RETRIES + 1}",
                      flush=True,
                  )

                  try:
                      subprocess.run(
                          command,
                          check=True,
                          timeout=remaining - 15,
                      )
                      return
                  except (subprocess.CalledProcessError,
                          subprocess.TimeoutExpired):
                      subprocess.run(
                          ["docker", "rm", "-f", name],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL,
                          timeout=10,
                          check=False,
                      )

                      if attempt == RETRIES:
                          raise

                      if DEADLINE - time.monotonic() <= COOLDOWN + 15:
                          raise TimeoutError("Insufficient time for retry")

                      print(f"Retrying in {COOLDOWN}s...", flush=True)
                      time.sleep(COOLDOWN)

          def clean():
              for snap in Path(".").glob("*.snap"):
                  snap.unlink()

          if not os.environ.get("SNAPCRAFT_STORE_CREDENTIALS"):
              raise RuntimeError("Missing Snapcraft Store credentials")

          retry("Build", [
              "-e", "SNAPCRAFT_BUILD_INFO=1",
              "-e", "USE_SNAPCRAFT_CHANNEL=9.x/stable",
              IMAGE, "snapcraft",
          ], before=clean)

          snaps = list(Path(".").glob("*.snap"))
          if len(snaps) != 1:
              raise RuntimeError(
                  f"Expected exactly one SNAP, found {len(snaps)}"
              )

          retry("Publish", [
              "-e", "SNAPCRAFT_STORE_CREDENTIALS",
              IMAGE, "snapcraft",
              "upload", snaps[0].name, "--release=edge",
          ])
